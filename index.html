<style>

/* === açılış ekranı === */
#in{gap:10px;background:linear-gradient(0deg,rgba(255,90,20,.34),transparent 30%),radial-gradient(90% 60% at 50% 55%,#3a1306,#0a0605 70%)}

#in{overflow:hidden}#in i{filter:drop-shadow(0 0 10px #ff7a1a)}
#in::before,#in::after{content:'';position:absolute;left:50%;bottom:-12px;width:4px;height:4px;background:#ffb21f;opacity:0}
