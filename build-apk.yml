name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Oyunu www klasorune koy
        run: |
          mkdir -p www
          cp index.html www/index.html

      - name: Bagimliliklari kur
        run: npm install

      - name: Fontlari indir
        run: |
          cat > fetch-fonts.mjs <<'EOF'
          import fs from 'node:fs';
          const UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120.0 Mobile Safari/537.36';
          const U=['https://fonts.googleapis.com/css2?family=Silkscreen&display=swap','https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap'];
          try{
          fs.mkdirSync('www/fonts',{recursive:true});let css='',n=0;
          for(const u of U){
          const res=await fetch(u,{headers:{'User-Agent':UA}});if(!res.ok)throw new Error('css '+res.status);
          let t=await res.text();
          for(const f of new Set([...t.matchAll(/url\((https:[^)]+)\)/g)].map(m=>m[1]))){
          const r=await fetch(f);if(!r.ok)throw new Error('font '+r.status);
          const nm='f'+(n++)+'.woff2';fs.writeFileSync('www/fonts/'+nm,Buffer.from(await r.arrayBuffer()));t=t.split(f).join(nm)}
          css+=t+'\n'}
          if(!n)throw new Error('font bulunamadi');
          fs.writeFileSync('www/fonts/fonts.css',css);
          let h=fs.readFileSync('www/index.html','utf8');
          h=h.replace(/<link rel="preconnect"[^>]*>\s*/g,'').replace(/<link href="https:\/\/fonts\.googleapis\.com[^>]*>\s*/g,'');
          if(!h.includes('fonts/fonts.css'))h=h.replace('<style>','<link rel="stylesheet" href="fonts/fonts.css">\n<style>');
          fs.writeFileSync('www/index.html',h);console.log('Fontlar indirildi',n)
          }catch(e){console.warn('Font indirilemedi: '+e.message)}
          EOF
          node fetch-fonts.mjs

      - name: Android projesini olustur
        run: npx cap add android

      - name: Ikon ve acilis ekrani uret
        run: |
          pip install pillow
          python3 make_icons.py
          npx capacitor-assets generate --android

      - name: Dikey ekrana kilitle
        run: sed -i '0,/<activity/s//<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Senkronize et
        run: npx cap sync android

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: FlameRunner-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
